<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración · DevBlog</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="system-bar">
        <div class="container system-bar__inner">
            <span class="system-bar__id">DEVBlog // PANEL DE ADMINISTRACIÓN</span>
            <button class="btn btn--secondary" type="button" id="logout-btn">Cerrar sesión</button>
        </div>
    </div>

    <header class="header">
        <div class="container header__inner">
            <a href="blog.html" class="header__brand">
                <span class="header__brand-name">← Volver al DevBlog</span>
            </a>
        </div>
    </header>

    <main>
        <nav class="admin-tabs" aria-label="Secciones de administración">
            <div class="container admin-tabs__inner" role="tablist">
                <button class="btn btn--primary" type="button" id="tab-articulos" role="tab" aria-controls="sec-articulos" aria-selected="true">Redactar artículo</button>
                <button class="btn btn--secondary" type="button" id="tab-proyectos" role="tab" aria-controls="sec-proyectos" aria-selected="false">Nuevo proyecto</button>
                <button class="btn btn--secondary" type="button" id="tab-perfil" role="tab" aria-controls="sec-perfil" aria-selected="false">Ajustes de perfil</button>
            </div>
        </nav>

        <section class="admin-section" id="sec-articulos" role="tabpanel" aria-labelledby="tab-articulos">
            <div class="container">
                <div class="articles__intro admin-intro">
                    <span class="section-label">CMS // ESCRITURA</span>
                    <h1 class="articles__title">Crear nuevo artículo</h1>
                </div>

                <form class="editor-card" id="post-form">
                    <div class="editor-grid">
                        <div class="form-group">
                            <label class="form-label" for="post-title">Título</label>
                            <input class="form-input" type="text" id="post-title" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="post-slug">Slug</label>
                            <input class="form-input" type="text" id="post-slug" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="post-category">Categoría</label>
                        <select class="form-select" id="post-category">
                            <option value="general">General</option>
                            <option value="frontend">Frontend</option>
                            <option value="backend">Backend</option>
                            <option value="desarrollo">Desarrollo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="post-body">Contenido</label>
                        <textarea class="form-textarea" id="post-body" required></textarea>
                    </div>

                    <p class="status-banner" id="editor-feedback" role="status" aria-live="polite"></p>
                    <div class="hero__actions admin-actions">
                        <button class="btn btn--primary" type="submit" id="save-post-btn">Guardar borrador</button>
                    </div>
                </form>

                <section class="admin-posts" aria-labelledby="admin-posts-title">
                    <div class="admin-posts__header">
                        <div class="articles__title-group">
                            <h2 class="articles__title" id="admin-posts-title">Artículos</h2>
                            <span class="badge badge--count" id="posts-count">0</span>
                        </div>
                        <button class="btn btn--secondary" type="button" id="refresh-btn">Actualizar lista</button>
                    </div>
                    <div class="admin-posts__grid" id="admin-posts-container"></div>
                </section>
            </div>
        </section>

        <section class="admin-section" id="sec-proyectos" role="tabpanel" aria-labelledby="tab-proyectos" hidden>
            <div class="container">
                <div class="articles__intro admin-intro">
                    <span class="section-label">PORTAFOLIO</span>
                    <h1 class="articles__title">Registrar proyecto</h1>
                    <p class="articles__description">Sube imágenes y detalla las tecnologías utilizadas.</p>
                </div>

                <form class="editor-card" id="project-form">
                    <div class="editor-grid">
                        <div class="form-group">
                            <label class="form-label" for="project-name">Nombre del proyecto</label>
                            <input class="form-input" type="text" id="project-name" placeholder="Ej. Lector QR Kotlin">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="project-repository">Enlace al repositorio (GitHub)</label>
                            <input class="form-input" type="url" id="project-repository" placeholder="https://github.com/tu-usuario/repo">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="project-image">Imagen principal del proyecto</label>
                        <input class="form-input" type="file" id="project-image" accept="image/png, image/jpeg, image/webp">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="project-technologies">Tecnologías (separadas por coma)</label>
                        <input class="form-input" type="text" id="project-technologies" placeholder="Kotlin, Jetpack Compose, Room">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="project-description">Descripción breve</label>
                        <textarea class="form-textarea" id="project-description" placeholder="¿Qué problema resuelve este proyecto?"></textarea>
                    </div>

                    <div class="hero__actions admin-actions">
                        <button type="submit" class="btn btn--primary">Guardar proyecto</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="admin-section" id="sec-perfil" role="tabpanel" aria-labelledby="tab-perfil" hidden>
            <div class="container">
                <div class="articles__intro admin-intro">
                    <span class="section-label">CONFIGURACIÓN</span>
                    <h1 class="articles__title">Actualizar perfil</h1>
                </div>

                <form class="editor-card" id="profile-form">
                    <div class="form-group">
                        <img class="profile-avatar" src="assets/images/perfil.jpg" alt="Avatar actual">
                        <label class="form-label" for="profile-image">Cambiar foto de perfil</label>
                        <input class="form-input" type="file" id="profile-image" accept="image/png, image/jpeg">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="profile-bio">Extracto / Bio (sección principal)</label>
                        <textarea class="form-textarea" id="profile-bio">Desarrollador en formación interesado en crear aplicaciones web y móviles...</textarea>
                    </div>

                    <div class="hero__actions admin-actions">
                        <button type="submit" class="btn btn--primary">Actualizar datos</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
