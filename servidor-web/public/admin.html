<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin · DevBlog</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="system-bar">
        <div class="container system-bar__inner">
            <span class="system-bar__id">SESIÓN ACTIVA · ADMIN CMS</span>
            <span class="system-bar__id">API: cms-admin-nrsh.onrender.com</span>
        </div>
    </div>

    <header class="header">
        <div class="container header__inner">
            <a href="blog.html" class="header__brand">
                <span class="header__brand-name">← Ver DevBlog Público</span>
            </a>
            <nav aria-label="Navegación admin">
                <ul class="nav__list">
                    <li><a href="#nuevo-post" class="nav__link">Nuevo Artículo</a></li>
                    <li><a href="#gestion-posts" class="nav__link">Artículos Guardados</a></li>
                    <li><button type="button" id="logout-btn" class="nav__link" style="color: var(--blog-yellow); border-color: rgba(250,204,21,0.4);">Cerrar Sesión</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="admin-section" id="nuevo-post">
            <div class="container">
                <div class="articles__intro" style="margin-bottom: var(--space-6);">
                    <span class="section-label">CMS // ESCRITURA</span>
                    <h1 class="articles__title">Crear Nuevo Artículo</h1>
                    <p class="articles__description">Los artículos se guardan en PostgreSQL como borrador (DRAFT) listos para publicarse.</p>
                </div>

                <form class="editor-card" id="post-form">
                    <div class="status-banner" id="editor-feedback"></div>

                    <div class="editor-grid">
                        <div class="form-group">
                            <label class="form-label" for="post-title">Título del artículo</label>
                            <input class="form-input" type="text" id="post-title" placeholder="Ej. Desplegando microservicios con gRPC" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="post-category">Categoría</label>
                            <select class="form-select" id="post-category">
                                <option value="general">General</option>
                                <option value="backend">Backend</option>
                                <option value="frontend">Frontend</option>
                                <option value="android">Android / Kotlin</option>
                                <option value="devops">DevOps / Cloud</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="post-slug">Slug (URL amigable, se genera automáticamente)</label>
                        <input class="form-input" type="text" id="post-slug" placeholder="desplegando-microservicios-con-grpc" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="post-body">Contenido del artículo</label>
                        <textarea class="form-textarea" id="post-body" placeholder="Escribe aquí el contenido o notas técnicas..." required></textarea>
                    </div>

                    <div class="hero__actions" style="margin-bottom: 0;">
                        <button type="submit" class="btn btn--primary" id="save-post-btn">Guardar Borrador en PostgreSQL</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="admin-section" id="gestion-posts">
            <div class="container">
                <div class="articles__header">
                    <div class="articles__intro">
                        <span class="section-label">BASE DE DATOS EN VIVO</span>
                        <div class="articles__title-group">
                            <h2 class="articles__title">Artículos en PostgreSQL</h2>
                            <span class="badge badge--count" id="posts-count">0</span>
                        </div>
                    </div>
                    <button type="button" class="btn btn--secondary" id="refresh-btn">↻ Recargar lista</button>
                </div>

                <div class="articles__grid" id="admin-posts-container"></div>
            </div>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
